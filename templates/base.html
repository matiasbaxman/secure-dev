<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecureDev Tickets</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <strong>SecureDev Tickets</strong>
    {% if session.user_id %}
      <a href="{{ url_for('index') }}">Mis tickets</a>
      <a href="{{ url_for('search') }}">Buscar</a>
      <span>{{ session.username }}</span>
      <form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button>Salir</button></form>
    {% endif %}
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
